# Dependabot version updates + 보안 알림 커버리지.
# 보안 알림은 의존성 그래프 기반이며, 여기 등록된 매니페스트(특히 커밋된
# src-tauri/Cargo.lock)가 그래프에 올라가야 cargo 취약점도 감지된다.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# 운용 정책 (2026-06-14):
#  - groups: 생태계마다 minor+patch 를 1개 PR 로, major 를 또 1개 PR 로 묶어 PR
#    눈덩이 방지 (2026-08-03: major 도 그룹화 — 예전엔 크레이트마다 개별 PR 이라
#    누적됐다). major 는 auto-merge 대상이 아니라 사람이 검토한다
#    (.github/workflows/dependabot-auto-merge.yml 이 major 를 제외).
#  - cooldown: 갓 배포된(침해 가능성 있는) 버전을 즉시 채택하지 않도록 지연.
#    시크릿 매니저 supply-chain 방어. 보안 업데이트(security-updates)는 cooldown 미적용 = 즉시.
#  - auto-merge: patch/minor 는 CI 4개 필수 체크 통과 + cooldown 경과 후 자동 머지.
#
# ⚠️ 운용 규칙 (2026-08-04 — PR 132건 중 83건(63%)이 머지 없이 close 된 원인):
#   **PR 을 그냥 close 하는 것은 일회성이다.** Dependabot 은 close 시 "이 *릴리스*는
#   다시 알리지 않지만 새 버전이 나오면 다시 연다"고 명시한다. 따라서 close 는
#   그 버전 하나만 억제하며, 특히 **날짜 기반 버저닝** 패키지(@cloudflare/*)에서는
#   사실상 매일 새 버전이 나오므로 영구히 무효다(@cloudflare/workers-types 10회 재생성).
#   → 채택하지 않기로 **판단한 major 는 반드시 이 파일의 `ignore` 에 사유·재검토
#     트리거와 함께 기록한다.** 기록하지 않은 거부는 매주 되살아난다.
#   → 단, ignore 는 보안 업데이트까지 함께 막으므로 "채택 불가"가 실측으로
#     확인된 것만 넣는다. 검토를 안 했을 뿐인 major 를 ignore 로 덮지 않는다
#     (실제로 workers-types 5 는 채택 불가가 아니라 미검토였고, 검증해보니 그대로 통과했다).
# (Dependabot 은 YAML 앵커/커스텀 키를 지원하지 않으므로 cooldown 을 항목마다 인라인)
version: 2
updates:
  # --- Rust (Tauri 백엔드 워크스페이스) ---
  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 5
      semver-patch-days: 3
      semver-minor-days: 5
      semver-major-days: 7
    groups:
      cargo-minor-patch:
        update-types: ["minor", "patch"]
      # major 도 하나로 묶는다 — auto-merge 는 여전히 제외되어 사람이 검토하지만,
      # 크레이트마다 PR 이 하나씩 열려 눈덩이가 되는 것을 막는다.
      cargo-major:
        update-types: ["major"]
    ignore:
      # rand/rand_core 0.9 는 chacha20poly1305(aead) 가 rand_core 0.6 을 잠그고
      # 있어 채택 불가 — OsRng 가 aead::rand_core 0.6 의 RngCore/CryptoRng trait 를
      # 구현하지 않아 E0277. aead/chacha20poly1305/age 스택이 rand_core 0.9 로
      # 올라올 때까지 보류 (2026-06-29 결정, docs/project-decisions.md ADR).
      # 0.8.x patch 는 계속 허용. >=0.9 만 차단.
      - dependency-name: "rand"
        versions: [">=0.9.0"]
      - dependency-name: "rand_core"
        versions: [">=0.9.0"]
      # age 0.11.3 / age-core 0.11.0 이 RustCrypto 구세대(sha2 0.10 / hmac 0.12 /
      # hkdf 0.12 / chacha20poly1305 0.10 / bech32 0.9)를 잠그고 있다. 우리 크레이트만
      # 올리면 같은 트레이트의 서로 다른 세대가 한 트리에 공존해 E0277 이 난다
      # (rand 0.9 와 동일한 구조). **재검토 트리거: age 0.11 → 0.12 업그레이드**
      # — age 0.12.1 이 이미 릴리스돼 있어 그 마이그레이션이 이 5건을 한 번에 푼다.
      # (2026-08-02 조사, docs/project-decisions.md ADR)
      - dependency-name: "sha2"
        versions: [">=0.11.0"]
      - dependency-name: "hmac"
        versions: [">=0.13.0"]
      - dependency-name: "hkdf"
        versions: [">=0.13.0"]
      - dependency-name: "chacha20poly1305"
        versions: [">=0.11.0"]
      - dependency-name: "bech32"
        versions: [">=0.10.0"]
      # tauri-plugin-sql 2.4.0 이 sqlx 0.8 을 요구한다. 상위 플러그인이 0.9 로
      # 올라오기 전까지 채택 불가. 재검토 트리거: tauri-plugin-sql sqlx 0.9 지원.
      - dependency-name: "sqlx"
        versions: [">=0.9.0"]

  # --- npm: 루트 pnpm 워크스페이스 (앱 프론트엔드 + extension + packages/shared) ---
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 5
      semver-patch-days: 3
      semver-minor-days: 5
      semver-major-days: 7
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
      npm-major:
        update-types: ["major"]

  # --- npm: EE Cloudflare Worker relay (독립 pnpm 프로젝트) ---
  #
  # 과거 이 두 항목은 Dependabot 이 `ee/*/pnpm-lock.yaml` 을 만들지 못해 CI 가 항상
  # red 였고(2026-08-02 에 한 번 제외했었다), 원인은 루트 pnpm-workspace.yaml 때문에
  # 하위 디렉터리 pnpm 실행 스코프가 루트로 잡히는 것이었다. 각 프로젝트에
  # **자체 pnpm-workspace.yaml 을 두어 workspace 루트 경계를 만들면** 플래그 없이도
  # 자기 lockfile 만 갱신되므로(재현 검증 완료) Dependabot 이 lockfile 포함 PR 을
  # 열 수 있다. → 다시 등록. `--ignore-workspace` 는 여전히 동작하므로 기존
  # deploy 워크플로는 무영향.
  - package-ecosystem: "npm"
    directory: "/ee/secretbank-relay"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 5
      semver-patch-days: 3
      semver-minor-days: 5
      semver-major-days: 7
    groups:
      relay-minor-patch:
        update-types: ["minor", "patch"]
      relay-major:
        update-types: ["major"]

  # --- npm: EE download-proxy (독립 pnpm 프로젝트) ---
  - package-ecosystem: "npm"
    directory: "/ee/cloudflare/download-proxy"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 5
      semver-patch-days: 3
      semver-minor-days: 5
      semver-major-days: 7
    groups:
      download-proxy-minor-patch:
        update-types: ["minor", "patch"]
      download-proxy-major:
        update-types: ["major"]

  # --- npm: VS Code 확장 (자체 package-lock.json) ---
  - package-ecosystem: "npm"
    directory: "/vscode-extension"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 5
      semver-patch-days: 3
      semver-minor-days: 5
      semver-major-days: 7
    groups:
      vscode-minor-patch:
        update-types: ["minor", "patch"]
      vscode-major:
        update-types: ["major"]
    ignore:
      # @types/node 20.x 는 **의도적 핀**이다. engines.vscode 가 ^1.96.0 이고 그
      # VS Code 가 번들한 Electron 런타임이 Node 20 이다. 타입만 26 으로 올리면
      # 런타임에 없는 API 가 컴파일을 통과해버린다.
      # 재검토 트리거: engines.vscode 하한을 Node 22 번들 버전으로 올릴 때.
      # (2026-08-04 — 그동안 ignore 가 없어 매주 PR 이 재생성됐다: #85/#91/#98 등 5회)
      - dependency-name: "@types/node"
        versions: [">=21.0.0"]
      # (typescript 는 ignore 하지 않는다. 한때 major 채택 불가로 보였으나 원인은
      #  tsconfig 에 `types: ["node","vscode"]` 가 없던 것이었다 — TS6 부터 @types
      #  자동 포함 동작이 바뀌었다. 그 한 줄을 넣으니 TS 7.0.2 로 컴파일까지 통과.
      #  2026-08-04, `ignore 로 덮기 전에 실제로 올려볼 것` 규칙의 실증 사례.)

  # --- GitHub Actions (워크플로우 액션 버전 — CLA @v2 같은 이동 태그 사고 방지) ---
  # NOTE: github-actions 생태계는 cooldown 의 semver-*-days 세분 키를 지원하지
  # 않는다(액션은 semver 를 엄격히 따르지 않음). default-days 만 사용.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 5
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]
      actions-major:
        update-types: ["major"]
