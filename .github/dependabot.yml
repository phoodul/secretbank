# Dependabot version updates + 보안 알림 커버리지.
# 보안 알림은 의존성 그래프 기반이며, 여기 등록된 매니페스트(특히 커밋된
# src-tauri/Cargo.lock)가 그래프에 올라가야 cargo 취약점도 감지된다.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# 운용 정책 (2026-06-14):
#  - groups: 생태계마다 minor+patch 를 1개 PR 로 묶어 PR 눈덩이 방지.
#    major 는 그룹 제외 → 개별 PR → 사람이 검토(.github/workflows/dependabot-auto-merge.yml
#    이 major 는 auto-merge 하지 않음).
#  - cooldown: 갓 배포된(침해 가능성 있는) 버전을 즉시 채택하지 않도록 지연.
#    시크릿 매니저 supply-chain 방어. 보안 업데이트(security-updates)는 cooldown 미적용 = 즉시.
#  - auto-merge: patch/minor 는 CI 4개 필수 체크 통과 + cooldown 경과 후 자동 머지.
# (Dependabot 은 YAML 앵커/커스텀 키를 지원하지 않으므로 cooldown 을 항목마다 인라인)
version: 2
updates:
  # --- Rust (Tauri 백엔드 워크스페이스) ---
  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 5
      semver-patch-days: 3
      semver-minor-days: 5
      semver-major-days: 7
    groups:
      cargo-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # rand/rand_core 0.9 는 chacha20poly1305(aead) 가 rand_core 0.6 을 잠그고
      # 있어 채택 불가 — OsRng 가 aead::rand_core 0.6 의 RngCore/CryptoRng trait 를
      # 구현하지 않아 E0277. aead/chacha20poly1305/age 스택이 rand_core 0.9 로
      # 올라올 때까지 보류 (2026-06-29 결정, docs/project-decisions.md ADR).
      # 0.8.x patch 는 계속 허용. >=0.9 만 차단.
      - dependency-name: "rand"
        versions: [">=0.9.0"]
      - dependency-name: "rand_core"
        versions: [">=0.9.0"]
      # age 0.11.3 / age-core 0.11.0 이 RustCrypto 구세대(sha2 0.10 / hmac 0.12 /
      # hkdf 0.12 / chacha20poly1305 0.10 / bech32 0.9)를 잠그고 있다. 우리 크레이트만
      # 올리면 같은 트레이트의 서로 다른 세대가 한 트리에 공존해 E0277 이 난다
      # (rand 0.9 와 동일한 구조). **재검토 트리거: age 0.11 → 0.12 업그레이드**
      # — age 0.12.1 이 이미 릴리스돼 있어 그 마이그레이션이 이 5건을 한 번에 푼다.
      # (2026-08-02 조사, docs/project-decisions.md ADR)
      - dependency-name: "sha2"
        versions: [">=0.11.0"]
      - dependency-name: "hmac"
        versions: [">=0.13.0"]
      - dependency-name: "hkdf"
        versions: [">=0.13.0"]
      - dependency-name: "chacha20poly1305"
        versions: [">=0.11.0"]
      - dependency-name: "bech32"
        versions: [">=0.10.0"]
      # tauri-plugin-sql 2.4.0 이 sqlx 0.8 을 요구한다. 상위 플러그인이 0.9 로
      # 올라오기 전까지 채택 불가. 재검토 트리거: tauri-plugin-sql sqlx 0.9 지원.
      - dependency-name: "sqlx"
        versions: [">=0.9.0"]

  # --- npm: 루트 pnpm 워크스페이스 (앱 프론트엔드 + extension + packages/shared) ---
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 5
      semver-patch-days: 3
      semver-minor-days: 5
      semver-major-days: 7
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]

  # --- npm: EE 독립 pnpm 프로젝트 (secretbank-relay / cloudflare/download-proxy) ---
  #
  # ⛔ 의도적으로 등록하지 않는다 (2026-08-02 결정).
  #
  # 이유: 루트에 pnpm-workspace.yaml 이 있어서 하위 디렉터리에서 pnpm 을 실행하면
  # 스코프가 루트 워크스페이스로 잡힌다. 그래서 `ee/*/pnpm-lock.yaml` 을 갱신하려면
  # `--ignore-workspace` CLI flag 가 필수인데(.npmrc 의 ignore-workspace 는 pnpm 이
  # 무시한다 — ee/secretbank-relay/.npmrc 주석 참조), Dependabot 은 이 flag 를 붙일
  # 수 없다. 결과적으로 Dependabot 은 package.json 만 바꾼 PR 을 열고, lockfile 이
  # 없으니 CI 의 `pnpm install --frozen-lockfile` 이 specifier mismatch 로 항상
  # 실패한다 → auto-merge 불가 → 매주 머지 불가능한 PR 이 누적됐다
  # (#25/58/60/62/64 수동 close, 이어서 #93/#101/#105/#115).
  #
  # 대신: 월 1회 직접 갱신한다. 각 디렉터리에서
  #   pnpm update --ignore-workspace && pnpm typecheck && pnpm test
  # 를 돌리고 lockfile 을 함께 커밋한다. major 는 그때 개별 검토.
  # 보안 취약점 PR 은 이 파일(version updates)과 무관하게 계속 생성되므로
  # 보안 커버리지에는 구멍이 없다.

  # --- npm: VS Code 확장 (자체 package-lock.json) ---
  - package-ecosystem: "npm"
    directory: "/vscode-extension"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 5
      semver-patch-days: 3
      semver-minor-days: 5
      semver-major-days: 7
    groups:
      vscode-minor-patch:
        update-types: ["minor", "patch"]

  # --- GitHub Actions (워크플로우 액션 버전 — CLA @v2 같은 이동 태그 사고 방지) ---
  # NOTE: github-actions 생태계는 cooldown 의 semver-*-days 세분 키를 지원하지
  # 않는다(액션은 semver 를 엄격히 따르지 않음). default-days 만 사용.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 5
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]
