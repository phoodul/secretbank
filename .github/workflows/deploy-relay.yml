name: Deploy Relay

on:
  push:
    branches: [main]
    paths:
      - "ee/secretbank-relay/**"
      - ".github/workflows/deploy-relay.yml"
  workflow_dispatch:

concurrency:
  group: deploy-relay
  cancel-in-progress: false

jobs:
  test:
    name: Test (typecheck + vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ee/secretbank-relay
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.0.9 # 버전은 package.json#packageManager 에서 읽는다

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ee/secretbank-relay/pnpm-lock.yaml

      - name: Install dependencies
        # ee/secretbank-relay 는 자체 pnpm-workspace.yaml 을 가진 독립 workspace 루트다
        # (root workspace 멤버가 아님). --ignore-workspace 를 쓰면 그 파일의 overrides 를
        # 건너뛰어 ERR_PNPM_LOCKFILE_CONFIG_MISMATCH 가 나므로 플래그 없이 설치한다.
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

  deploy:
    name: Deploy to Cloudflare Workers
    needs: test
    # Cloudflare 계정 + API token 등록 전까지 skip.
    # 활성화 시: GitHub repo Settings → Secrets and variables → Actions →
    #   Variables 탭 → "RELAY_DEPLOY_ENABLED" = "true" 설정.
    # 그리고 Secrets 탭에 CLOUDFLARE_API_TOKEN 등록.
    if: ${{ vars.RELAY_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ee/secretbank-relay
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.0.9 # 버전은 package.json#packageManager 에서 읽는다

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ee/secretbank-relay/pnpm-lock.yaml

      - name: Install dependencies
        # ee/secretbank-relay 는 자체 pnpm-workspace.yaml 을 가진 독립 workspace 루트다
        # (root workspace 멤버가 아님). --ignore-workspace 를 쓰면 그 파일의 overrides 를
        # 건너뛰어 ERR_PNPM_LOCKFILE_CONFIG_MISMATCH 가 나므로 플래그 없이 설치한다.
        run: pnpm install --frozen-lockfile

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: ee/secretbank-relay
