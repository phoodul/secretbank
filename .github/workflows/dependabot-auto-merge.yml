name: Dependabot auto-merge

# Dependabot 의 patch/minor PR 을 CI(main branch protection 의 4개 필수 체크) 통과 +
# dependabot.yml 의 cooldown 경과 후 자동 머지한다. major 는 제외 → 사람이 검토.
# 목적: 버전업 PR 눈덩이 제거 → 진짜 손볼 보안 알림만 남기기.
#
# 안전장치:
#  - gh pr merge --auto 는 머지를 "예약"만 하며, 실제 머지는 branch protection 의
#    필수 status check 4개(Rust / Frontend / E2E smoke / EE Relay)가 green 일 때만 일어난다.
#    bad bump 이 CI 를 깨면 머지되지 않고 PR 이 열린 채 남는다.
#  - major 업데이트는 enable 자체를 건너뛴다(아래 if).
#  - cooldown(dependabot.yml)이 갓 배포된 버전의 즉시 채택을 막는다(supply-chain 방어).
#  - 액션은 이동 태그(@v3) 대신 SHA 핀 (CLA @v2 이동 태그 사고 교훈).

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      # cargo 의 0.x crate 는 SemVer 상 minor 로 분류되지만 Cargo 세계에서는
      # 0.12 → 0.13 이 breaking 이다 (hkdf/hmac/sha2/chacha20poly1305 등 크립토
      # 크레이트가 여기 해당). CI 가 막아주긴 하나 API 표면이 우연히 호환될 때
      # breaking 이 자동 머지될 수 있어 명시적으로 제외한다.
      # gradle 제외 사유 (2026-08-05): jetbrains-plugin 은 CI 잡이 없다. 잡을 붙여
      # 봤더니 이 플러그인은 **원래부터 빌드 불가 상태**였고(IntelliJ Platform API
      # 마이그레이션 필요, docs/task.md 백로그), 상시 red 인 잡은 알림 부채가 되어
      # 잡을 제거했다. 검증 게이트가 없는 경로를 자동 머지하면 08-03 download-proxy
      # 사고(#86/92/99/106/114)가 반복되므로 사람이 검토한다. Dependabot 등록 자체는
      # 취약점 탐지를 위해 유지한다.
      # 재검토 트리거: jetbrains-plugin 빌드 복구 + CI 잡 재신설 시 이 조건 제거.
      - name: Enable auto-merge (patch/minor only; major·cargo 0.x minor·gradle 은 수동 검토)
        if: >-
          ${{ steps.meta.outputs.update-type != 'version-update:semver-major'
          && steps.meta.outputs.package-ecosystem != 'gradle'
          && !(steps.meta.outputs.package-ecosystem == 'cargo'
               && startsWith(steps.meta.outputs.previous-version, '0.')
               && steps.meta.outputs.update-type == 'version-update:semver-minor') }}
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
