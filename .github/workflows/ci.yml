name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust (fmt / clippy / test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust (rust-toolchain.toml 에 핀된 버전)
        # stable 을 떠다니게 두면 새 clippy lint 가 모든 PR 을 한꺼번에 red 로 만든다
        # (2026-09 Rust 1.99 사고). rustup 이 repo 루트의 rust-toolchain.toml 을 읽어
        # 그 버전과 components 를 설치한다.
        run: |
          rustup toolchain install
          rustup show active-toolchain

      # Tauri / wry 가 link 하는 Linux native libraries.
      # 없으면 glib-sys / webkit2gtk-sys 가 pkg-config 단계에서 fail.
      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Cache cargo target
        uses: actions/cache@v6.1.0
        with:
          path: src-tauri/target
          # Cargo.lock 커밋됨 — lock hash 로 key 생성 (의존성 변경 시 자동 invalidate)
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: cargo fmt --check
        run: cargo fmt --all --manifest-path src-tauri/Cargo.toml -- --check

      # --locked: 커밋된 Cargo.lock 을 강제. 의존성 재해석 금지 → 재현 빌드 +
      # transitive 신규(broken) 릴리스 자동 채택 방지. lock 갱신 필요 시 CI fail.
      - name: cargo clippy
        run: cargo clippy --workspace --locked --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: cargo test
        run: cargo test --workspace --locked --manifest-path src-tauri/Cargo.toml

  frontend:
    name: Frontend (typecheck / lint / format / vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.9 # 버전은 package.json#packageManager 에서 읽는다

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Vitest
        run: pnpm test --run

  e2e:
    name: E2E smoke (Playwright browser-mode)
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.9 # 버전은 package.json#packageManager 에서 읽는다

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-playwright-

      - name: Install Playwright Chromium
        run: pnpm e2e:install

      - name: Run Playwright smoke tests
        run: pnpm e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  ee-relay:
    name: EE Relay (typecheck + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ee/secretbank-relay
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.0.9 # 버전은 package.json#packageManager 에서 읽는다

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ee/secretbank-relay/pnpm-lock.yaml

      - name: Install dependencies
        # ee/secretbank-relay 는 자체 pnpm-workspace.yaml 을 가진 독립 workspace 루트다.
        # --ignore-workspace 를 쓰면 pnpm 이 그 파일(overrides 포함)을 건너뛰어
        # ERR_PNPM_LOCKFILE_CONFIG_MISMATCH 가 난다(2026-10-06). 플래그 없이 설치한다.
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

  # ee/cloudflare/download-proxy 는 오랫동안 어떤 워크플로도 참조하지 않아 CI
  # 커버리지가 0이었다. 그 결과 Dependabot 이 lockfile 없이 package.json 만 바꾼
  # PR 들이 게이트 없이 자동 머지되어 lockfile 이 stale 해졌다(#86/92/99/106/114).
  # 같은 사고가 반복되지 않도록 잡을 추가한다.
  ee-download-proxy:
    name: EE Download Proxy (typecheck + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ee/cloudflare/download-proxy
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.0.9 # 버전은 package.json#packageManager 에서 읽는다

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ee/cloudflare/download-proxy/pnpm-lock.yaml

      - name: Install dependencies
        # 자체 pnpm-workspace.yaml(overrides 포함)을 읽어야 하므로 --ignore-workspace 금지.
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

  # vscode-extension 도 같은 사각지대였다 — release.yml 에서만 참조되고 PR/push CI 가
  # 없어 Dependabot PR 이 컴파일 검증 없이 auto-merge 됐다(2026-08-04 #134). 08-03 에
  # download-proxy 를 고치면서 이 확장은 놓쳤다. 같은 누락을 남기지 않기 위해 추가.
  vscode-extension:
    name: VS Code Extension (compile)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile (tsc)
        run: npm run compile
