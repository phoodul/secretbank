packages:
  - "."

# overrides 는 반드시 여기(pnpm-workspace.yaml)에 둔다. package.json#pnpm.overrides 는
# pnpm 11 부터 무시되며, Dependabot 기본 pnpm 이 11 이라 그 위치에 두면 Dependabot 이 만든
# lockfile 에서 overrides: 헤더가 사라져 CI --frozen-lockfile 이 깨진다(2026-10-06 진단).
# pnpm 10 과 11 이 모두 읽는 위치는 이 파일뿐이다.
overrides:
  wrangler: ^4.147.0
  vite: ^6.4.3
  esbuild: ">=0.28.1"
  "sharp@<0.35.4": ^0.35.4
  "undici@<7.29.1": ^7.29.1
