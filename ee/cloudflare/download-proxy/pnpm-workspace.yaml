packages:
  - "."

# overrides 는 반드시 여기(pnpm-workspace.yaml)에 둔다. package.json#pnpm.overrides 는
# pnpm 11 부터 무시되며, Dependabot 기본 pnpm 이 11 이라 그 위치에 두면 Dependabot 이 만든
# lockfile 에서 overrides: 헤더가 사라져 CI --frozen-lockfile 이 깨진다(2026-10-06 진단).
# pnpm 10 과 11 이 모두 읽는 위치는 이 파일뿐이다.
overrides:
  wrangler: ^4.147.0
  vite: ^8.3.1
  esbuild: ">=0.28.1"
  "sharp@<0.35.5": ^0.35.5
  "undici@<7.29.1": ^7.29.1

# pnpm 11 부터 strictDepBuilds 가 기본 true 라 승인 안 된 build script 는 경고가 아니라
# ERR_PNPM_IGNORED_BUILDS 로 install 자체가 실패한다. pnpm 10 에서도 아래 스크립트는
# 실행되지 않은 채(경고만) 동작했으므로 false = 종전과 동일한 동작이다(2026-10-11).
allowBuilds:
  esbuild: false
  workerd: false
