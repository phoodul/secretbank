packages:
  - "."
  - "extension"
  - "packages/*"

# overrides 는 반드시 여기(pnpm-workspace.yaml)에 둔다. package.json#pnpm.overrides 는
# pnpm 11 부터 무시되며, Dependabot 기본 pnpm 이 11 이라 그 위치에 두면 Dependabot 이 만든
# lockfile 에서 overrides: 헤더가 사라져 CI --frozen-lockfile 이 깨진다(2026-10-06 진단).
# pnpm 10 과 11 이 모두 읽는 위치는 이 파일뿐이다.
overrides:
  "tmp@<0.2.6": ^0.2.6
  "uuid@<11.1.1": ^11.1.1
  "shell-quote@<1.9.0": ^1.9.0
  "esbuild@<0.28.1": ^0.28.1
  "undici@<7.29.1": ^7.29.1
  "js-yaml@<4.3.2": ^4.3.2
  "brace-expansion@<1.1.16": ^1.1.16
  "brace-expansion@>=3.0.0 <5.0.7": ^5.0.7
  "adm-zip@<0.6.0": ^0.6.0
  "@babel/core@<7.29.6": ^7.29.6
  "vite@>=7.0.0 <7.3.5": ^7.3.5
  "browserslist@<4.28.7": ^4.28.7
  "baseline-browser-mapping@<2.11.0": ^2.11.0
  "nanoid@<3.3.18": ^3.3.18
